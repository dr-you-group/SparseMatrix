name: feature-extraction-v2

services:
  rstudio:
    build:
      context: .
      dockerfile: docker/Dockerfile.rstudio
    image: feature-extraction-v2-rstudio:4.6.1
    container_name: feature-extraction-v2-rstudio
    ports:
      - "28787:8787"
    environment:
      PASSWORD: "${FEATURE_EXTRACTION_V2_RSTUDIO_PASSWORD:?Set FEATURE_EXTRACTION_V2_RSTUDIO_PASSWORD}"
      USERID: "1001"
      GROUPID: "1001"
      TZ: "Asia/Seoul"
      EUNOMIA_DATA_FOLDER: "/home/rstudio/feature_extraction_v2/data/eunomia"
      DUCKDB_EXTENSION_DIRECTORY: "/home/rstudio/feature_extraction_v2/data/duckdb/extensions"
      DATABASECONNECTOR_JAR_FOLDER: "/home/rstudio/feature_extraction_v2/jdbc"
      SPARSE_MATRIX_PROJECT_ROOT: "/home/rstudio/feature_extraction_v2"
      SPARSE_MATRIX_ANDROMEDA_TEMP_FOLDER: "/home/rstudio/feature_extraction_v2/data/andromeda"
      SPARSE_MATRIX_OUTPUT_FOLDER: "/home/rstudio/feature_extraction_v2/output"
      SPARSE_MATRIX_DB_SERVER: "${SPARSE_MATRIX_DB_SERVER:-}"
      SPARSE_MATRIX_DB_PORT: "${SPARSE_MATRIX_DB_PORT:-1433}"
      SPARSE_MATRIX_DB_USER: "${SPARSE_MATRIX_DB_USER:-}"
      SPARSE_MATRIX_DB_PASSWORD: "${SPARSE_MATRIX_DB_PASSWORD:-}"
      SPARSE_MATRIX_CDM_DATABASE_SCHEMA: "${SPARSE_MATRIX_CDM_DATABASE_SCHEMA:-}"
      SPARSE_MATRIX_COHORT_DATABASE_SCHEMA: "${SPARSE_MATRIX_COHORT_DATABASE_SCHEMA:-}"
      SPARSE_MATRIX_COHORT_TABLE: "${SPARSE_MATRIX_COHORT_TABLE:-cohort}"
      SPARSE_MATRIX_BATCH_SIZE: "${SPARSE_MATRIX_BATCH_SIZE:-1000000}"
    volumes:
      - /workspace/feature_extraction_v2:/home/rstudio/feature_extraction_v2
    working_dir: /home/rstudio/feature_extraction_v2
    restart: unless-stopped
